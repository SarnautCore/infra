name: sarnaut-p4

services:
  p4d:
    image: sarnaut/helix-p4d:2026.1
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NAME: sarnaut-p4d
      P4NAME: master
      P4TCP: "1666"
      P4PORT: "1666"
      P4USER: ${P4SUPERUSER:-sarnaut}
      P4BOOTSTRAP_PASSWORD: ${P4SUPER_PASSWORD:?Set P4SUPER_PASSWORD in .env before first start}
      P4CASE: -C0
      P4CHARSET: utf8
    entrypoint: ["/bin/bash", "/usr/local/bin/sarnaut-init.sh"]
    ports:
      - "1666:1666"
    volumes:
      - type: bind
        source: ${P4DEPOT_BIND_SOURCE:-G:/SarnautCore-p4depot}
        target: /p4
    healthcheck:
      test: ["CMD-SHELL", "p4 -p localhost:1666 info -s >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - sarnaut-p4

networks:
  sarnaut-p4:
    name: sarnaut-p4
    driver: bridge
